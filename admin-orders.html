<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Orders - Sweet Surprise</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="admin">
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="index.html"><span class="brand-word">Sweet Surprise</span></a>
        <nav class="nav">
          <a href="index.html">Shop</a>
          <a href="user-orders.html">My Orders</a>
          <a href="admin-orders.html" aria-current="page">Admin Orders</a>
          <a href="rider-orders.html">Rider Orders</a>
          <button type="button" class="ghost auth-btn" id="logout-btn">Logout</button>
          <span class="auth-status small muted" id="user-email">...</span>
        </nav>
      </div>
    </header>
    <main class="shop">
      <div class="shop-head">
        <h2>Admin Orders Dashboard</h2>
        <p class="muted">Approve payments, assign riders, and close completed orders.</p>
      </div>
      <p class="small" id="page-notice" hidden></p>
      <section class="dashboard-wrap">
        <div class="dashboard-head">
          <h2>Promotion Manager</h2>
        </div>
        <div class="dashboard-grid">
          <div class="dashboard-card">
            <form id="promo-form" class="dashboard-form">
              <label>
                Promo Code
                <input name="code" type="text" required maxlength="24" placeholder="SWEET10" />
              </label>
              <label>
                Type
                <select name="type">
                  <option value="percent">Percent (%)</option>
                  <option value="fixed">Fixed amount (PHP)</option>
                </select>
              </label>
              <label>
                Value
                <input name="value" type="number" min="1" required />
              </label>
              <label>
                Minimum Subtotal (optional)
                <input name="minSubtotal" type="number" min="0" />
              </label>
              <label>
                Start At (optional)
                <input name="startAt" type="datetime-local" />
              </label>
              <label>
                End At (optional)
                <input name="endAt" type="datetime-local" />
              </label>
              <label class="check-row">
                <input type="checkbox" name="active" checked />
                <span>Active</span>
              </label>
              <fieldset class="checkout-fieldset">
                <legend>Allowed Payments</legend>
                <label class="check-row"><input type="checkbox" name="allow_cod" checked /><span>COD</span></label>
                <label class="check-row"><input type="checkbox" name="allow_gcash" checked /><span>GCash</span></label>
                <label class="check-row"><input type="checkbox" name="allow_maya" checked /><span>Maya</span></label>
              </fieldset>
              <div class="checkout-actions">
                <button class="primary" type="submit">Save Promo</button>
              </div>
            </form>
          </div>
          <div class="dashboard-card">
            <h3>Active / Scheduled Promos</h3>
            <div id="promo-list" class="dashboard-list"></div>
          </div>
        </div>
      </section>
      <div id="orders-list" class="dashboard-list"></div>
    </main>
